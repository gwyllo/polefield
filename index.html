<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polefield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21 15 3M9 21 20 3M3 13l18-2"/></svg>Polefield <small>mockup</small></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="stats" id="stats"></div>
    <span class="pill idle" id="status">FEA not run</span>
    <button class="btn primary" id="feaBtn">Run FEA</button>
    <button class="btn" id="panelToggle">Panel</button>
  </header>

  <nav class="rail" id="rail" aria-label="Tools"></nav>

  <main class="vp" id="vp">
    <div class="toolname" id="toolname"></div>
    <div class="legend" id="legend" hidden></div>
    <div class="progress" id="progress" hidden><span id="progLbl">Analysing</span><i><b id="progBar"></b></i></div>
    <div class="hud" id="hud"></div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="side" id="side"></aside>

  <footer class="tl" id="tl" hidden>
    <div class="tlbar">
      <button class="btn" id="tlPlay">Play</button>
      <button class="btn" id="tlPrev" aria-label="Previous step">&#8249;</button>
      <button class="btn" id="tlNext" aria-label="Next step">&#8250;</button>
      <input type="range" id="tlStep" min="0" max="0" value="0" aria-label="Assembly step">
      <span class="cap" id="tlLbl"></span>
    </div>
    <canvas id="tlChart" aria-label="Deflection and utilisation per assembly step"></canvas>
  </footer>
</div>
<input type="file" id="fileSvg" class="hidden-file" accept=".svg,image/svg+xml">
<input type="file" id="fileImg" class="hidden-file" accept="image/png,image/jpeg,image/webp">

<script type="module" src="/src/main.ts"></script>
</body>
</html>
