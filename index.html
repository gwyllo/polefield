<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Polefield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed workshop tool. Tool rail | 3D viewport | inspector panel, assembly timeline under the viewport. */
:root{
  --bg:#e6e5df; --panel:#f5f4ef; --panel-2:#ecebe4; --line:#d3d1c7; --line-2:#bdbaaf;
  --fg:#1e201b; --muted:#666860; --accent:#17694f; --accent-soft:#d5e7de; --accent-ink:#ffffff;
  --timber:#d9c193; --steel:#7f858a; --ok:#2e7a3a; --warn:#a46d0a; --crit:#b23327;
  --vp-bg:#efeee9; --grid-minor:#dfddd5; --grid-major:#c7c4b9;
  --field-h:#a8661a; --field-v:#17694f; --seq-lo:#d3e2ee; --seq-hi:#1f447a;
  --font-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131516; --panel:#1a1d1e; --panel-2:#212526; --line:#2e3335; --line-2:#3e4447;
  --fg:#e4e2da; --muted:#959890; --accent:#4cbf92; --accent-soft:#1c392e; --accent-ink:#07130e;
  --timber:#c9ad78; --steel:#9aa1a6; --ok:#62c171; --warn:#e2a83c; --crit:#f06b5c;
  --vp-bg:#191c1d; --grid-minor:#222628; --grid-major:#30363a;
  --field-h:#e0a050; --field-v:#4cbf92; --seq-lo:#2a3c4f; --seq-hi:#9cc9ff; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#131516; --panel:#1a1d1e; --panel-2:#212526; --line:#2e3335; --line-2:#3e4447;
  --fg:#e4e2da; --muted:#959890; --accent:#4cbf92; --accent-soft:#1c392e; --accent-ink:#07130e;
  --timber:#c9ad78; --steel:#9aa1a6; --ok:#62c171; --warn:#e2a83c; --crit:#f06b5c;
  --vp-bg:#191c1d; --grid-minor:#222628; --grid-major:#30363a;
  --field-h:#e0a050; --field-v:#4cbf92; --seq-lo:#2a3c4f; --seq-hi:#9cc9ff; color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:52px minmax(0,1fr) 330px;grid-template-rows:48px minmax(0,1fr) auto;
  grid-template-areas:"top top top" "rail vp side" "rail tl side"}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-cond);font-weight:600;font-size:19px;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:22px;height:22px;color:var(--accent)}
.brand small{font-family:var(--font-mono);font-size:10px;font-weight:400;color:var(--muted);letter-spacing:0;border:1px solid var(--line-2);border-radius:3px;padding:1px 4px}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tab{border:0;background:none;padding:6px 11px;border-radius:4px;font-family:var(--font-cond);font-size:15px;font-weight:500;letter-spacing:.03em;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--panel-2)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
.stats{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-family:var(--font-mono);font-size:11px;white-space:nowrap;border:1px solid currentColor}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.crit{color:var(--crit)} .pill.idle{color:var(--muted)}
#panelToggle{display:none}

/* rail */
.rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;overflow-y:auto}
.tool{width:38px;height:38px;border:1px solid transparent;border-radius:6px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{color:var(--fg);background:var(--panel-2)}
.tool[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.tool kbd{position:absolute;right:2px;bottom:1px;font-family:var(--font-mono);font-size:8px;color:var(--muted)}
.rail hr{width:26px;border:0;border-top:1px solid var(--line);margin:4px 0}

/* viewport */
.vp{grid-area:vp;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--vp-bg)}
.vp canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;bottom:10px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);pointer-events:none;line-height:1.6;max-width:calc(100% - 24px)}
.hud b{color:var(--fg);font-weight:500}
.toolname{position:absolute;left:12px;top:10px;font-family:var(--font-cond);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);pointer-events:none;display:flex;gap:10px;align-items:baseline}
.toolname span{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--muted)}
.legend{position:absolute;right:12px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);min-width:170px}
.legend .bar{height:8px;border-radius:2px;margin:5px 0 3px}
.legend .ends{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.legend .ttl{font-family:var(--font-cond);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg)}
.progress{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-family:var(--font-mono);font-size:11px;display:flex;gap:10px;align-items:center}
.progress i{display:block;width:140px;height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.progress i b{display:block;height:100%;background:var(--accent);width:0}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 12px;border-radius:5px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:80%;text-align:center}
.toast.show{opacity:1}

/* side panel */
.side{grid-area:side;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:0}
.pane{display:flex;flex-direction:column}
.sec{padding:12px 16px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-family:var(--font-cond);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sec p{margin:0;color:var(--muted);line-height:1.45;font-size:12.5px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:8px;align-items:center}
.row label{color:var(--fg);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{font-family:var(--font-mono);font-size:11px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.row.two{grid-template-columns:96px minmax(0,1fr)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:12.5px}
input[type=color]{width:100%;height:24px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);padding:1px}
.check{display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
.check input{accent-color:var(--accent);margin:0}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:4px;padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:4px 8px;font-size:12px;cursor:pointer;align-items:center;border-left:3px solid transparent}
.li:hover{background:var(--panel)}
.li.cur{background:var(--accent-soft)}
.li .n{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.li .s{font-family:var(--font-mono);font-size:10.5px}
.li.ok{border-left-color:var(--ok)} .li.warn{border-left-color:var(--warn)} .li.crit{border-left-color:var(--crit)}
.s.ok{color:var(--ok)} .s.warn{color:var(--warn)} .s.crit{color:var(--crit)}
.note{font-size:12px;color:var(--muted);line-height:1.45;padding:8px 10px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}
.note.crit{border-color:var(--crit);color:var(--fg)} .note.warn{border-color:var(--warn);color:var(--fg)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;max-height:240px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
th,td{padding:4px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-weight:500;text-align:right}
th:first-child,td:first-child{text-align:left}
canvas.unroll{width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);display:block}
.cap{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* timeline */
.tl{grid-area:tl;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tlbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tlbar input[type=range]{flex:1;min-width:120px}
.tlbar .cap b{color:var(--fg);font-weight:500}
#tlChart{width:100%;height:96px;display:block;cursor:pointer}

@media (max-width:760px){
  #app{grid-template-columns:44px minmax(0,1fr);grid-template-areas:"top top" "rail vp" "rail tl"}
  .tool{width:34px;height:34px}
  .stats{display:none}
  #panelToggle{display:inline-flex;margin-left:auto}
  .side{position:fixed;left:0;right:0;bottom:0;height:58%;z-index:20;transform:translateY(102%);transition:transform .2s;border-top:1px solid var(--line-2);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .side.open{transform:none}
  .legend{min-width:0;max-width:46%}
  .hud{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21 15 3M9 21 20 3M3 13l18-2"/></svg>Polefield <small>mockup</small></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="stats" id="stats"></div>
    <span class="pill idle" id="status">FEA not run</span>
    <button class="btn primary" id="feaBtn">Run FEA</button>
    <button class="btn" id="panelToggle">Panel</button>
  </header>

  <nav class="rail" id="rail" aria-label="Tools"></nav>

  <main class="vp" id="vp">
    <div class="toolname" id="toolname"></div>
    <div class="legend" id="legend" hidden></div>
    <div class="progress" id="progress" hidden><span id="progLbl">Analysing</span><i><b id="progBar"></b></i></div>
    <div class="hud" id="hud"></div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="side" id="side"></aside>

  <footer class="tl" id="tl" hidden>
    <div class="tlbar">
      <button class="btn" id="tlPlay">Play</button>
      <button class="btn" id="tlPrev" aria-label="Previous step">&#8249;</button>
      <button class="btn" id="tlNext" aria-label="Next step">&#8250;</button>
      <input type="range" id="tlStep" min="0" max="0" value="0" aria-label="Assembly step">
      <span class="cap" id="tlLbl"></span>
    </div>
    <canvas id="tlChart" aria-label="Deflection and utilisation per assembly step"></canvas>
  </footer>
</div>
<input type="file" id="fileSvg" class="hidden-file" accept=".svg,image/svg+xml">
<input type="file" id="fileImg" class="hidden-file" accept="image/png,image/jpeg,image/webp">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const clamp = (x,a,b) => x<a?a:x>b?b:x;
const lerp = (a,b,t) => a+(b-a)*t;
const DEG = Math.PI/180;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

/* ------------------------------------------------------------------ parameters */
const P = {
  preset:'truss', baseStrength:1, noise:0.25,
  radius:1.0, strength:0.6, planeMode:'view', planeH:1.4, planeD:0,
  channel:'density', showChannel:'none', arrows:true, arrowLen:0.2,
  sketchW:1.4, sketchR:0.5, imgW:1.2, imgMode:'both', imgPlane:'xy',
  count:2000, seed:7, lenMin:0.4, lenMax:0.9, diaMin:25, diaMax:38, stock:true,
  weave:28, weaveAxis:'lateral', spacing:0.12, prune:true, snap:0.2,
  reach:300, maxJ:6, holeSpace:70, endDist:60, dowel:'m10', clear:25,
  colorBy:'timber', woodA:'#e3cc9b', woodB:'#7d522e',
  patOn:true, patType:'mix', patRange:200, patSpacing:30, patWidth:3, patTaper:true, patPhase:0,
  grade:'ash', support:'fixed', clamp:50, loadFactor:1.35, pointLoad:0, defScale:1, resultColor:'util',
  strategy:'greedy', stages:30, limitDisp:15, limitUtil:100, props:false, ghosts:true, live:true, autoFea:false
};
const PRESETS = {
  arch:{label:'Arch canopy', min:[-5.4,0,-1.4], max:[5.4,5.6,1.4], weave:24, weaveAxis:'lateral',
    base:(x,y,z)=>{const r=Math.hypot(x,y)+1e-3,R0=4.3,k=0.7*(R0-r);return[-y/r+k*x/r, x/r+k*y/r, 0];},
    dens:(x,y,z)=>{const r=Math.hypot(x,y);return Math.exp(-Math.pow((r-4.3)/0.7,2))*0.95+0.03;}, diam:(x,y,z)=>1-y/3.5},
  tower:{label:'Twisting column', min:[-2.6,0,-2.6], max:[2.6,7.5,2.6], weave:32, weaveAxis:'inplane',
    base:(x,y,z)=>[-z*0.5,1,x*0.5],
    dens:(x,y,z)=>{const r=Math.hypot(x,z);return Math.exp(-Math.pow((r-2.0)/0.5,2))*0.95+0.03;}, diam:(x,y,z)=>1-y/5},
  truss:{label:'Spanning truss', min:[-7,0,-0.7], max:[7,2.6,0.7], weave:38, weaveAxis:'inplane',
    base:(x,y,z)=>[1,0.25*Math.sin(x*0.6),0], dens:()=>0.85, diam:(x,y,z)=>1-y/1.6},
  blank:{label:'Empty volume', min:[-2.5,0,-2.5], max:[2.5,4.5,2.5], weave:28, weaveAxis:'lateral',
    base:()=>[0,1,0], dens:()=>0.6}
};
const GRADES = {
  ash:{label:'Ash broom handle', E:12e9, G:0.75e9, rho:680, fm:14e6},
  pine:{label:'Pine dowel, C24', E:11e9, G:0.69e9, rho:470, fm:11e6},
  oak:{label:'Oak, D30', E:11e9, G:0.69e9, rho:720, fm:13e6}
};
const DOWELS = {
  m8:{label:'M8 threaded rod', d:0.0068, hole:9, E:200e9, G:77e9, rho:7850, fy:240e6},
  m10:{label:'M10 threaded rod', d:0.0085, hole:11, E:200e9, G:77e9, rho:7850, fy:240e6},
  hw12:{label:'12 mm hardwood dowel', d:0.012, hole:12, E:12e9, G:0.75e9, rho:700, fy:20e6}
};
const STOCK_DIA = [22,25,28,32,38,45];
const CHANNELS = {density:'Density', length:'Pole length', diameter:'Pole diameter', tint:'Tint'};

const S = { poles:[], dowels:[], strokes:[], mode:'field', tool:'nav', selected:-1, res:null, asm:null, asmStep:0, undo:[], playing:false, image:null };

/* ------------------------------------------------------------------ field */
const F = {};
function setupField(key, keepParams){
  const pr = PRESETS[key];
  F.min = new V3(...pr.min); F.max = new V3(...pr.max);
  const sz = new V3().subVectors(F.max, F.min);
  const cs=0.3; F.nx = clamp(Math.round(sz.x/cs)+1,5,60); F.ny = clamp(Math.round(sz.y/cs)+1,5,60); F.nz = clamp(Math.round(sz.z/cs)+1,4,60);
  F.hx = sz.x/(F.nx-1); F.hy = sz.y/(F.ny-1); F.hz = sz.z/(F.nz-1);
  const N = F.N = F.nx*F.ny*F.nz;
  F.pos = new Float32Array(N*3); F.base = new Float32Array(N*3); F.paint = new Float32Array(N*3);
  F.sketch = new Float32Array(N*3); F.img = new Float32Array(N*3); F.total = new Float32Array(N*3); F.dir = new Float32Array(N*3);
  F.imgDark = new Float32Array(N);
  F.ch = {density:new Float32Array(N), length:new Float32Array(N).fill(0.5), diameter:new Float32Array(N).fill(0.3), tint:new Float32Array(N)};
  F.densEff = new Float32Array(N);
  for(let k=0;k<F.nz;k++)for(let j=0;j<F.ny;j++)for(let i=0;i<F.nx;i++){
    const c = idx(i,j,k), x=F.min.x+i*F.hx, y=F.min.y+j*F.hy, z=F.min.z+k*F.hz;
    F.pos[c*3]=x;F.pos[c*3+1]=y;F.pos[c*3+2]=z;
    const b = pr.base(x,y,z); F.base[c*3]=b[0];F.base[c*3+1]=b[1];F.base[c*3+2]=b[2];
    F.ch.density[c] = pr.dens(x,y,z);
    if(pr.diam) F.ch.diameter[c] = clamp(pr.diam(x,y,z),0,1); // thicker poles low down, where load collects
  }
  if(!keepParams){ P.weave = pr.weave; P.weaveAxis = pr.weaveAxis; }
  S.strokes = []; S.image = null; S.undo = [];
  rebuildBoundsViz(); rebuildSketchViz(); rebuildImageViz();
  computeImage();
  recomputeField(true);
}
function idx(i,j,k){ return i + F.nx*(j + F.ny*k); }
function noiseVec(x,y,z){
  return [Math.sin(1.9*y+0.7)*Math.cos(1.3*z+0.2), Math.sin(1.7*z+1.1)*Math.cos(1.2*x+0.5), Math.sin(1.5*x+0.3)*Math.cos(1.6*y+0.9)];
}
function recomputeField(full){
  const N=F.N, T=F.total;
  // pre-sketch field (sketch tangents are aligned to it)
  for(let c=0;c<N;c++){
    const x=F.pos[c*3],y=F.pos[c*3+1],z=F.pos[c*3+2], n=noiseVec(x,y,z);
    for(let a=0;a<3;a++) T[c*3+a] = F.base[c*3+a]*P.baseStrength + n[a]*P.noise + F.paint[c*3+a] + F.img[c*3+a]*P.imgW;
  }

function makeOrder(strategy){

  if(strategy==='bottom') return S.poles.slice().sort((a,b)=>Math.min(a.a.y,a.b.y)-Math.min(b.a.y,b.b.y)||mid(a).y-mid(b).y).map(p=>p.id);

  if(strategy==='random'){ const r=mulberry32(P.seed+99), o=S.poles.map(p=>p.id); for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]];} return o; }

  const padX=6,padY=14, w=W-2*padX, h=H-2*padY-10;
  const wood=new THREE.Color(P.woodA).lerp(new THREE.Color(P.woodB),p.tint);
  const img=x.createImageData(Math.round(w*dpr),Math.round(h*dpr)), iw=img.width, ih=img.height, d=img.data;
  const c=new V3(), o=new V3(), px=[0,0]; let grooveArea=0, grooveW=0;
  for(let j=0;j<ih;j++){ const th=(j/ih)*Math.PI*2; o.copy(p.ref).multiplyScalar(Math.cos(th)).addScaledVector(p.w,Math.sin(th)).multiplyScalar(p.r);
    for(let i=0;i<iw;i++){ const t=i/(iw-1); c.copy(p.a).lerp(p.b,t).add(o);
      let g=0; if(P.patOn){ proxAt(p.id,c.x,c.y,c.z,px); const hw=patHalfW(px[0]); if(patDistCPU(px[0],px[1])<hw){ g=1; grooveArea++; grooveW+=hw*2; } }
      const k=(j*iw+i)*4; d[k]=g?0x3d:wood.r*255; d[k+1]=g?0x2a:wood.g*255; d[k+2]=g?0x18:wood.b*255; d[k+3]=255; } }
  x.fillStyle=css('--panel-2'); x.fillRect(0,0,W,H);
  x.putImageData(img,padX*dpr,padY*dpr);
  x.strokeStyle=css('--line-2'); x.strokeRect(padX+.5,padY+.5,w,h);
  // holes: entry and exit (through holes are drilled 180° apart)
  const hd=DOWELS[P.dowel].hole/1000, sx=w/p.len, sy=h/(Math.PI*2*p.r);
  for(const hl of p.holes){
    for(const [a,solid] of [[hl.ang,true],[(hl.ang+180)%360,false]]){
      const cx=padX+hl.t*w, cy=padY+a/360*h;
      x.beginPath(); x.ellipse(cx,cy,Math.max(2,hd/2*sx),Math.min(h/2,hd/2*sy),0,0,Math.PI*2);
      x.fillStyle=solid?css('--fg'):'transparent'; x.strokeStyle=css('--fg'); x.lineWidth=1.2; if(solid) x.fill(); x.stroke(); }
  }
  x.font='10px "JetBrains Mono", monospace'; x.fillStyle=css('--muted');
  x.textAlign='left'; x.fillText('A · base end',padX,10); x.textAlign='right'; x.fillText(`${Math.round(p.len*1000)} mm`,W-padX,10);
  x.textAlign='left'; x.fillText(`0°`,padX+2,padY+h+11); x.textAlign='right'; x.fillText(`circumference ×${Math.max(1,Math.round(sy/sx))} vertical scale`,W-padX,padY+h+11);
  // approximate routed length = groove area / mean groove width
  const pxArea=(p.len/iw)*(Math.PI*2*p.r/ih);
  return grooveArea?grooveArea*pxArea/(grooveW/grooveArea):0;
}

function onParam(k){
  if(k==='preset'){ setupField(P.preset); regenerate(); frameCamera(); renderPanel(); return; }
  if(['baseStrength','noise','sketchW','sketchR','imgW'].includes(k)){ afterFieldEdit(); return; }
  if(k==='imgMode'||k==='imgPlane'){ if(S.image){ S.image.plane=P.imgPlane; computeImage(); rebuildImageViz(); } afterFieldEdit(); return; }
  if(k==='arrows'||k==='arrowLen'){ updateArrows(); applyDisplay(); return; }
  if(KEYS.fieldViz.includes(k)){ updatePlane(); hudUpdate(); updateChannelViz(); updateLegend(currentResult()); if(k==='channel'||k==='showChannel') renderPanel(); return; }
  if(KEYS.poles.includes(k)){ clearTimeout(regenTimer); regenTimer=setTimeout(regenerate,30); return; }
  if(KEYS.look.includes(k)){ applyDisplay(); if(S.mode==='fab') renderPanel(); return; }
  if(KEYS.pattern.includes(k)){ updatePatternUniforms(); applyDisplay(); if(S.mode==='fab'||S.mode==='pattern') renderPanelSoft(); return; }
  if(k==='autoFea'){ if(P.autoFea&&!S.res) runAnalysis(); return; }
  if(KEYS.analysis.includes(k)){ if(S.mode==='analyse'||P.autoFea){ clearTimeout(regenTimer); regenTimer=setTimeout(runAnalysis,30);} else { S.res=null; setStatus(); } if(S.asm) S.asm.stale=true; return; }
  if(KEYS.display.includes(k)){ applyDisplay(); return; }

}

      if(k==='diaMin'&&v>P.diaMax) v=P.diaMax; if(k==='diaMax'&&v<P.diaMin) v=P.diaMin;

  const floating=S.poles.filter(p=>!gnd.has(comp[p.id])), single=S.poles.filter(p=>!p.grounded&&p.holes.length===1), none=S.poles.filter(p=>p.holes.length===0&&!p.grounded);
  const out=[];
  if(floating.length) out.push(`<div class="note crit"><b>${floating.length} pole${floating.length>1?'s':''} not connected to the ground</b> (${floating.slice(0,8).map(p=>pname(p.id)).join(', ')}${floating.length>8?'…':''}). Increase dowel reach or paint more density between clusters.</div>`);
  if(single.length) out.push(`<div class="note warn"><b>${single.length} pole${single.length>1?'s':''} hang on a single dowel</b> and rely on nut clamping to stop rotation.</div>`);
  if(!out.length) out.push(`<div class="note">Every pole is connected to the ground through dowels.</div>`);

}

        ${SEL('resultColor','Colour by',{util:'Stress utilisation',disp:'Displacement'})}${R('defScale','Shape scale',0,3,0.1,'×')}</div>`;
      const top=[...r.poleUtil.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
      h+=`<div class="sec"><h3>Most stressed poles</h3><div class="list">${top.map(([id,u])=>`<div class="li ${u>P.limitUtil/100?'crit':u>0.7*P.limitUtil/100?'warn':'ok'}${id===S.selected?' cur':''}" data-sel="${id}"><span class="n">${pname(id)}</span><span>${Math.round(S.poles[id].len*1000)} mm · Ø${S.poles[id].dia}</span><span class="s">${Math.round(u*100)}%</span></div>`).join('')}</div></div>`;
    }
  }
  if(m==='assemble'){
    const a=S.asm;
    h+=`<div class="sec"><h3>Assembly sequence</h3><p>Poles are placed in stages. After each stage the frame analysis re-runs on what is standing, to check the partial structure holds up and stays within tolerance for holographic placement.</p>
      ${SEL('strategy','Order',{greedy:'Connected growth (grounded first)',bottom:'Bottom up',sweep:'Sweep along X',random:'Random (stress test)',custom:'Custom (edited below)'})}
      ${R('stages','Stages',5,80,1)}<p class="cap">${Math.ceil(S.poles.length/P.stages)} poles per stage</p>
      ${R('limitDisp','Deflection limit',2,50,1,'mm')}${R('limitUtil','Stress limit',50,150,5,'%')}
      ${CHK('props','Add temporary supports under poles that are not yet connected')}${CHK('ghosts','Show unplaced poles faintly')}
      <div class="btns"><button class="btn primary" id="runSeq">${a?'Re-run sequence':'Run sequence'}</button></div>
      ${a&&a.stale?'<div class="note warn">Settings changed since this run. Re-run to update.</div>':''}</div>`;
    if(a&&a.steps.length){
      const bad=a.steps.filter(s=>s.status==='crit').length, warn=a.steps.filter(s=>s.status==='warn').length;
      const peak=a.steps.reduce((m,s)=>Math.max(m,s.maxDisp),0), peakU=a.steps.reduce((m,s)=>Math.max(m,s.maxUtil),0);
      h+=`<div class="sec"><h3>Summary <span class="pill ${bad?'crit':warn?'warn':'ok'}">${bad?bad+' failing':warn?warn+' to check':'feasible'}</span></h3>
        <dl class="kv"><dt>Stages</dt><dd>${a.stages.length} × ${a.stages[0]} poles</dd><dt>Peak deflection</dt><dd>${(peak*1000).toFixed(1)} mm</dd><dt>Peak utilisation</dt><dd>${Math.round(peakU*100)}%</dd><dt>Temporary supports</dt><dd>${a.steps.reduce((m,s)=>Math.max(m,s.props.length),0)} max</dd></dl>
        ${S.selected>=0?`<div class="btns"><button class="btn" id="mvEarly">Place ${pname(S.selected)} a stage earlier</button><button class="btn" id="mvLate">Later</button></div>`:'<p class="cap">Select a pole to move it in the order.</p>'}</div>`;
      h+=`<div class="sec"><h3>Stages</h3><div class="list" id="stepList">${a.steps.map((st,i)=>{ const [p0,p1]=stageRange(i); return `<div class="li ${st.status}${i===S.asmStep?' cur':''}" data-step="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>poles ${p0}–${p1}</span><span class="s ${st.status}">${st.status==='crit'?(st.floating.length&&!st.props.length?'free':st.mech.length?'swings':st.maxUtil>P.limitUtil/100?'over':'sags'):(st.maxDisp*1000).toFixed(1)+' mm'}</span></div>`;}).join('')}</div></div>`;
    }
  }
  if(m==='fab'){
    const p=S.poles[S.selected];
    if(p){
      const stockLen=[1200,1500,1800,2400,3000].find(v=>v>=p.len*1000+20)||'custom';
      h+=`<div class="sec"><h3>${pname(p.id)} <span class="cap">${p.grounded?'grounded':'free'} · ${p.holes.length} holes</span></h3>
        <dl class="kv"><dt>Cut length</dt><dd>${Math.round(p.len*1000)} mm</dd><dt>Diameter</dt><dd>${p.dia} mm</dd><dt>Cut from stock</dt><dd>${stockLen} mm</dd><dt>Groove length</dt><dd id="routeLen">…</dd></dl>
        <canvas class="unroll" id="unroll"></canvas>
        <p class="cap">Unrolled surface from end A. Filled ellipses: drill entry; outlined: through-hole exit. 0° is the reference line marked along the top of the pole.</p>
        <div class="btns"><button class="btn" id="fPrev">&#8249; Previous</button><button class="btn" id="fNext">Next &#8250;</button><button class="btn" id="fFrame">Zoom to pole</button></div></div>`;
      h+=`<div class="sec"><h3>Drill schedule</h3><div class="tblwrap"><table><thead><tr><th>Hole</th><th>From A</th><th>Rotate</th><th>Tilt</th><th>Ø</th><th>To</th></tr></thead><tbody>
        ${p.holes.map((hl,i)=>`<tr><td>H${i+1}</td><td>${Math.round(hl.pos*1000)}</td><td>${hl.ang.toFixed(1)}°</td><td>${hl.tilt.toFixed(1)}°</td><td>${DOWELS[P.dowel].hole}</td><td>${pname(hl.other)}</td></tr>`).join('')}</tbody></table></div>
        <p class="cap">mm. Rotate = angle around the pole from the 0° mark. Tilt = angle between hole and pole axis (90° is square).</p></div>`;
    } else h+=`<div class="sec"><h3>Fabrication</h3><p>Select a pole in the viewport.</p></div>`;
    const bins={}; for(const q of S.poles){ const s=[1200,1500,1800,2400,3000].find(v=>v>=q.len*1000+20)||'>3000'; const k=`${q.dia} mm × ${s}`; bins[k]=(bins[k]||0)+1; }
    h+=`<div class="sec"><h3>Cut list</h3><div class="tblwrap"><table><thead><tr><th>Stock</th><th>Qty</th></tr></thead><tbody>${Object.entries(bins).sort().map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</tbody></table></div>
      <p class="cap">${S.dowels.length} × ${DOWELS[P.dowel].label}, ${(S.dowels.reduce((s,d)=>s+d.len,0)).toFixed(1)} m total · ${S.dowels.length*2} holes · ${S.dowels.length*4} nuts</p>
      <div class="btns"><button class="btn primary" id="copyCsv">Copy drill schedule (CSV)</button><button class="btn" id="copyJson">Copy model (JSON)</button></div>
      <p class="cap">Hand-off to Fologram for HoloLens drilling and placement is not part of this mockup.</p></div>`;
  }
  side.innerHTML=h; bindPanel(side);
  const on=(id,fn)=>{const el=document.getElementById(id); if(el) el.onclick=fn;};
  on('resetField',()=>{pushUndo(); F.paint.fill(0); afterFieldEdit(); toast('Painted forces cleared');});
  on('regen',regenerate);
  on('exSketch',()=>{pushUndo(); exampleSketch(); });
  on('impSvg',()=>$('#fileSvg').click()); on('impImg',()=>$('#fileImg').click());
  on('clrSketch',()=>{pushUndo(); S.strokes=[]; S.image=null; computeImage(); rebuildSketchViz(); rebuildImageViz(); afterFieldEdit(); renderPanel();});
  on('runFea',runAnalysis);
  on('runSeq',()=>runSequence());
  on('mvEarly',()=>moveInOrder(-1)); on('mvLate',()=>moveInOrder(1));
  on('fPrev',()=>select((S.selected-1+S.poles.length)%S.poles.length)); on('fNext',()=>select((S.selected+1)%S.poles.length)); on('fFrame',()=>frameCamera(S.poles[S.selected]));
  on('copyCsv',()=>copyText(drillCSV(),'Drill schedule copied as CSV'));
  on('copyJson',()=>copyText(modelJSON(),'Model copied as JSON'));
  side.querySelectorAll('[data-sel]').forEach(el=>el.onclick=()=>select(+el.dataset.sel));
  side.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>gotoStep(+el.dataset.step));
  const cur=side.querySelector('#stepList .cur'); if(cur) cur.scrollIntoView({block:'nearest'});
  renderPanelSoft();
}
function moveInOrder(dir){
  if(!S.asm) return; const o=S.asm.order, i=o.indexOf(S.selected); if(i<0) return;
  const j=clamp(i+dir*S.asm.stages[0],0,o.length-1); o.splice(i,1); o.splice(j,0,S.selected); P.strategy='custom'; runSequence();
}
function copyText(t,msg){
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;height:40%;z-index:50;font:11px monospace'; document.body.appendChild(ta); ta.select(); toast('Clipboard blocked. Text is selected: press Ctrl+C, then click away'); ta.onblur=()=>ta.remove(); ta.focus(); };
  try{ navigator.clipboard.writeText(t).then(()=>toast(msg),fallback); }catch(e){ fallback(); }
}
function drillCSV(){
  const rows=['pole,stock_dia_mm,cut_length_mm,hole,from_end_A_mm,rotate_deg,tilt_deg,hole_dia_mm,connects_to'];
  for(const p of S.poles) p.holes.forEach((h,i)=>rows.push([pname(p.id),p.dia,Math.round(p.len*1000),'H'+(i+1),Math.round(h.pos*1000),h.ang.toFixed(1),h.tilt.toFixed(1),DOWELS[P.dowel].hole,pname(h.other)].join(',')));
  return rows.join('\n');
}
function modelJSON(){
  const r3=v=>[+v.x.toFixed(4),+v.y.toFixed(4),+v.z.toFixed(4)];
  return JSON.stringify({units:'m',connector:DOWELS[P.dowel].label,poles:S.poles.map(p=>({id:pname(p.id),a:r3(p.a),b:r3(p.b),diameter_mm:p.dia,grounded:p.grounded,holes:p.holes.map(h=>({t:+h.t.toFixed(4),rotate_deg:+h.ang.toFixed(2),tilt_deg:+h.tilt.toFixed(2),to:pname(h.other)}))})),
    dowels:S.dowels.map(d=>({a:pname(d.pi),b:pname(d.pj),gap_mm:Math.round(d.gap*1000),length_mm:Math.round(d.len*1000)})), assembly_order:S.asm?S.asm.order.map(pname):null},null,1);
}
function updateStats(){
  const tl=S.poles.reduce((s,p)=>s+p.len,0);
  const mass=S.poles.reduce((s,p)=>s+Math.PI*p.r*p.r*p.len*GRADES[P.grade].rho,0);
  $('#stats').textContent=`${S.poles.length} poles · ${S.dowels.length} dowels · ${S.dowels.length*2} holes · ${tl.toFixed(1)} m timber · ${mass.toFixed(0)} kg`;
}

/* sketch import */
function exampleSketch(){
  const pts=(fn,n)=>Array.from({length:n},(_,i)=>fn(i/(n-1)));
  const sz=new V3().subVectors(F.max,F.min), cx=(F.min.x+F.max.x)/2, z=F.min.z+sz.z*0.5;
  S.strokes.push({extrude:'z',pts:pts(t=>new V3(F.min.x+sz.x*(0.08+0.84*t), F.min.y+sz.y*(0.15+0.7*Math.sin(t*Math.PI)) , z),40)});
  S.strokes.push({extrude:'z',pts:pts(t=>new V3(cx+Math.cos(t*Math.PI*3)*sz.x*0.18*(1-t*0.5), F.min.y+sz.y*(0.1+0.8*t), z),40)});
  rebuildSketchViz(); afterFieldEdit(); renderPanel(); toast('Example sketch loaded as two guide curves (extruded through depth)');
}
$('#fileSvg').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return; const txt=await f.text(); e.target.value='';
  const holder=document.createElement('div'); holder.style.cssText='position:absolute;left:-9999px;top:0;width:10px;height:10px;overflow:hidden';
  holder.innerHTML=txt; document.body.appendChild(holder);
  const svg=holder.querySelector('svg'); if(!svg){ holder.remove(); toast('That file has no <svg> element'); return; }
  const els=[...svg.querySelectorAll('path,line,polyline,polygon,circle,ellipse,rect')];
  const raw=[];
  for(const el of els){ try{ const L=el.getTotalLength(); if(!(L>0)) continue; const n=clamp(Math.ceil(L/6),8,200), m=el.getCTM&&el.getCTM();
    const pts=[]; for(let i=0;i<=n;i++){ let p=el.getPointAtLength(L*i/n); if(m&&svg.createSVGPoint){ const q=svg.createSVGPoint(); q.x=p.x;q.y=p.y; p=q.matrixTransform(m);} pts.push([p.x,p.y]); } raw.push(pts);}catch(err){} }
  holder.remove();
  if(!raw.length){ toast('No drawable curves found in that SVG'); return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; raw.flat().forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});
  const sz=new V3().subVectors(F.max,F.min), s=Math.min(sz.x*0.9/(x1-x0||1),(P.imgPlane==='xy'?sz.y:sz.z)*0.9/(y1-y0||1));
  pushUndo();
  for(const pts of raw){
    const v=pts.map(([x,y])=>{ const u=(x-(x0+x1)/2)*s, w=(y-(y0+y1)/2)*s;
      return P.imgPlane==='xy'? new V3((F.min.x+F.max.x)/2+u,(F.min.y+F.max.y)/2-w,(F.min.z+F.max.z)/2) : new V3((F.min.x+F.max.x)/2+u,0.02,(F.min.z+F.max.z)/2+w); });
    S.strokes.push({extrude:P.imgPlane==='xy'?'z':'y',pts:v});
  }
  rebuildSketchViz(); afterFieldEdit(); renderPanel(); toast(`Imported ${raw.length} curve${raw.length>1?'s':''} from ${f.name}`);
});
$('#fileImg').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{ const w=160,h=Math.round(160*im.height/im.width)||160, c=document.createElement('canvas'); c.width=w;c.height=h; const x=c.getContext('2d'); x.drawImage(im,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data, lum=new Float32Array(w*h);
    for(let i=0;i<w*h;i++) lum[i]=(0.2126*d[i*4]+0.7152*d[i*4+1]+0.0722*d[i*4+2])/255*(d[i*4+3]/255)+(1-d[i*4+3]/255);
    // light blur so contours give a smooth direction field
    const b=new Float32Array(w*h); for(let pass=0;pass<3;pass++){ for(let j=0;j<h;j++)for(let i=0;i<w;i++){let s=0,n=0;for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ii=i+di,jj=j+dj;if(ii>=0&&jj>=0&&ii<w&&jj<h){s+=lum[jj*w+ii];n++;}} b[j*w+i]=s/n;} lum.set(b); }
    pushUndo(); S.image={lum,w,h,plane:P.imgPlane,canvas:c,name:f.name}; URL.revokeObjectURL(url);
    computeImage(); rebuildImageViz(); afterFieldEdit(); renderPanel(); toast(`Image ${f.name} projected onto the ${P.imgPlane==='xy'?'front':'ground'} plane`); };
  im.onerror=()=>toast('That image could not be read'); im.src=url;
});

/* camera */
function frameCamera(p){
  if(p){ const c=p.a.clone().add(p.b).multiplyScalar(.5); const d=camera.position.clone().sub(controls.target).normalize(); controls.target.copy(c); camera.position.copy(c).addScaledVector(d,p.len*1.6+0.6); controls.update(); return; }
  const c=F.min.clone().add(F.max).multiplyScalar(.5), s=F.max.distanceTo(F.min);
  controls.target.copy(c); camera.position.set(c.x+s*0.85,c.y+s*0.55,c.z+s*1.05); controls.update();
}
function resize(){ const w=vp.clientWidth,h=vp.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); if(S.mode==='assemble') drawChart(); }
new ResizeObserver(resize).observe(vp);
function applyTheme(){
  scene.background=new THREE.Color(css('--vp-bg')); makeGrids();
  ring.material.color.set(css('--accent')); ballMat.color.set(css('--accent'));
  if(paintPlane){ paintPlane.material.color.set(css('--accent')); paintPlane.children[0].material.color.set(css('--accent')); }
  if(boundsBox) boundsBox.material.color.set(css('--line-2'));
  rebuildSketchViz(); updateArrows(); updatePatternUniforms(); if(S.poles.length) applyDisplay(); if(S.mode==='assemble') drawChart(); if(S.mode==='fab'||S.mode==='pattern') renderPanelSoft();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  controls.update();
  if(P.planeMode==='view'&&S.tool!=='nav') updatePlane();
  if(S.playing&&S.asm&&!S.asm.running&&t-playT>420){ playT=t; if(S.asmStep<S.asm.steps.length-1) gotoStep(S.asmStep+1); else { S.playing=false; $('#tlPlay').textContent='Play'; } }
  renderer.render(scene,camera);
}

/* boot */
buildChrome();
setupField(P.preset);
applyTheme();
generate();
if(P.autoFea) runAnalysis(); setStatus();
$('#feaBtn').onclick=()=>{ if(S.mode==='analyse') runAnalysis(); else setMode('analyse'); };
updateStats(); updatePatternUniforms(); setMode('field'); hudUpdate(); frameCamera(); resize();
requestAnimationFrame(loop);
</script>
</body>
